<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Poker Circular Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container { position: relative; width: 500px; height: 500px; border-radius: 50%; background: #1e293b; border: 12px solid #334155; display: flex; items-center; justify-content: center; }
        .player-spot { position: absolute; transform: translate(-50%, -50%); transition: all 0.5s ease; }
        .buzz { animation: buzz 0.1s infinite; }
        @keyframes buzz { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }
        .emoji-fly { position: absolute; animation: fly 1s forwards; pointer-events: none; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen overflow-x-hidden" id="mainBody">

    <div id="login" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-80 text-center">
            <h1 class="text-2xl font-black mb-6">POKER PLAN</h1>
            <input type="text" id="username" placeholder="Nombre" class="w-full p-3 mb-3 bg-slate-800 rounded-xl outline-none">
            <input type="text" id="room" placeholder="Sala" class="w-full p-3 mb-6 bg-slate-800 rounded-xl outline-none">
            <button onclick="joinRoom()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">Entrar</button>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center">
        <div>
            <div class="flex items-center gap-3">
                <h2 id="roomTitle" class="text-xl font-bold text-blue-400">...</h2>
                <button onclick="copyLink()" class="text-[10px] uppercase border border-slate-700 px-2 py-1 rounded hover:bg-slate-800">Copiar Link</button>
            </div>
            <input type="text" id="taskInput" onchange="updateTask()" class="bg-transparent border-b border-slate-800 outline-none text-slate-500 w-full" placeholder="Tarea actual...">
        </div>
        <div class="flex gap-2">
            <button onclick="exportCSV()" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Descargar CSV Sesión</button>
            <button onclick="reset()" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold text-red-400">Reiniciar Ronda</button>
        </div>
    </header>

    <div class="flex flex-col items-center mt-10">
        <div class="table-container mb-20 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <div id="grid" class="relative w-full h-full"></div>
            <div class="text-center z-10">
                <button onclick="reveal()" class="bg-emerald-600 px-6 py-3 rounded-full font-black hover:scale-105 transition">REVELAR</button>
                <div id="avg" class="hidden mt-2 text-2xl font-bold"></div>
            </div>
        </div>

        <div id="deck" class="flex gap-2 p-4 bg-slate-900/80 rounded-3xl border border-slate-800 overflow-x-auto max-w-full"></div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "", lastState = {}, emojiClicks = 0;

        function joinRoom() {
            const user = document.getElementById('username').value;
            const room = document.getElementById('room').value || "general";
            if(!user) return;
            currentRoom = room;
            document.getElementById('login').style.display = 'none';
            document.getElementById('roomTitle').innerText = room;
            socket.emit('join_room', { roomId: room, username: user });
        }

        const deck = [1,2,3,5,8,13,21,'?'];
        deck.forEach(v => {
            const b = document.createElement('button');
            b.innerText = v;
            b.className = "w-12 h-16 bg-white text-slate-900 rounded-xl font-bold text-lg hover:-translate-y-2 transition-all flex-shrink-0";
            b.onclick = () => socket.emit('cast_vote', { roomId: currentRoom, value: v });
            document.getElementById('deck').appendChild(b);
        });

        socket.on('update_state', (state) => {
            lastState = state;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const players = Object.entries(state.votes);
            const total = players.length;
            
            players.forEach(([id, p], i) => {
                const angle = (i * (360 / total)) * (Math.PI / 180);
                const radius = 220; 
                const x = 250 + radius * Math.cos(angle);
                const y = 250 + radius * Math.sin(angle);

                const pDiv = document.createElement('div');
                pDiv.className = "player-spot flex flex-col items-center";
                pDiv.style.left = `${x}px`;
                pDiv.style.top = `${y}px`;

                let cardVal = state.visible ? (p.value ?? "-") : (p.value ? "✓" : "");
                let cardColor = p.value ? (state.visible ? "bg-white text-blue-600" : "bg-blue-600 text-white") : "bg-slate-800 border-dashed border-2 border-slate-700";

                pDiv.innerHTML = `
                    <div class="w-14 h-20 ${cardColor} rounded-xl flex items-center justify-center text-xl font-black shadow-xl mb-2 cursor-pointer" onclick="sendEmoji('${id}')">
                        ${cardVal}
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${p.name}</span>
                `;
                grid.appendChild(pDiv);
            });
        });

        function sendEmoji(id) {
            socket.emit('send_emoji', { roomId: currentRoom, toSocketId: id, emoji: '🔥' });
        }

        socket.on('receive_emoji', ({ emoji }) => {
            emojiClicks++;
            const span = document.createElement('span');
            span.innerText = emoji;
            span.className = "emoji-fly left-1/2 top-1/2 text-4xl";
            document.body.appendChild(span);
            setTimeout(() => span.remove(), 1000);

            if(emojiClicks > 8) {
                document.getElementById('mainBody').classList.add('buzz');
                setTimeout(() => { 
                    document.getElementById('mainBody').classList.remove('buzz');
                    emojiClicks = 0;
                }, 1000);
            }
        });

        function exportCSV() {
            if(!lastState.history.length) return alert("No hay rondas grabadas aún.");
            let csv = "Ronda,Tarea,Jugador,Puntos\n";
            lastState.history.forEach((round, i) => {
                Object.entries(round.results).forEach(([name, points]) => {
                    csv += `${i+1},${round.task},${name},${points}\n`;
                });
            });
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `sesion-${currentRoom}.csv`; a.click();
        }

        function reveal() { socket.emit('reveal_votes', currentRoom); }
        function reset() { socket.emit('reset_game', currentRoom); }
        function updateTask() { socket.emit('update_task', { roomId: currentRoom, taskName: document.getElementById('taskInput').value }); }
        function copyLink() { navigator.clipboard.writeText(`${window.location.origin}/?room=${currentRoom}`); alert("Link copiado"); }

        const u = new URLSearchParams(window.location.search).get('room');
        if(u) document.getElementById('room').value = u;
    </script>
</body>
</html>
