<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Poker Plan Pro - Circular</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-center { position: relative; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); border: 10px solid #334155; }
        .player-spot { position: absolute; transform: translate(-50%, -50%); z-index: 20; }
        .buzz-active { animation: buzz 0.1s infinite !important; }
        @keyframes buzz { 0% { transform: translate(3px, 3px); } 50% { transform: translate(-3px, -3px); } 100% { transform: translate(3px, -3px); } }
        .projectile { position: fixed; pointer-events: none; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; font-size: 2rem; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen overflow-hidden flex flex-col items-center p-4">

    <div id="login" class="fixed inset-0 bg-slate-950/90 z-[200] flex items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-[2rem] border border-slate-800 w-full max-w-sm">
            <h1 class="text-3xl font-black text-center mb-6 text-blue-500">POKER PLAN</h1>
            <input type="text" id="username" placeholder="Tu Nombre" class="w-full p-4 mb-3 bg-slate-800 rounded-xl outline-none border border-transparent focus:border-blue-500">
            <input type="text" id="room" placeholder="Nombre de la Sala" class="w-full p-4 mb-6 bg-slate-800 rounded-xl outline-none border border-transparent focus:border-blue-500">
            <button onclick="joinRoom()" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-lg hover:bg-blue-500">Entrar</button>
        </div>
    </div>

    <header class="w-full max-w-6xl flex justify-between items-center mb-8">
        <div>
            <div class="flex items-center gap-3">
                <h2 id="roomTitle" class="text-2xl font-bold text-blue-400 italic">...</h2>
                <button onclick="copyLink()" class="text-[10px] bg-slate-800 px-3 py-1 rounded-full border border-slate-700">COPIAR LINK</button>
            </div>
            <input type="text" id="taskInput" onchange="updateTask()" class="bg-transparent border-b border-slate-800 text-slate-500 outline-none w-64 focus:text-white" placeholder="Estimando tarea...">
        </div>
        <div class="flex gap-3">
            <div id="emoji-selector" class="flex bg-slate-900 p-2 rounded-full border border-slate-800 gap-2">
                <button onclick="selectedEmoji='🔥'" class="hover:scale-125 transition">🔥</button>
                <button onclick="selectedEmoji='⭐'" class="hover:scale-125 transition">⭐</button>
                <button onclick="selectedEmoji='🃏'" class="hover:scale-125 transition">🃏</button>
                <button onclick="selectedEmoji='🎯'" class="hover:scale-125 transition">🎯</button>
            </div>
            <button onclick="exportCSV()" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">CSV</button>
            <button onclick="reset()" class="bg-red-900/30 text-red-400 px-4 py-2 rounded-xl text-xs font-bold border border-red-900/50">NUEVA RONDA</button>
        </div>
    </header>

    <div class="table-center flex items-center justify-center shadow-2xl shadow-blue-900/20">
        <div id="grid" class="relative w-full h-full"></div>
        <div class="text-center z-10 bg-slate-900/80 p-6 rounded-full border border-slate-700 backdrop-blur-sm">
            <button onclick="reveal()" class="bg-blue-600 px-8 py-4 rounded-full font-black text-xl hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">REVELAR</button>
            <div id="avg" class="mt-2 text-3xl font-black text-blue-400"></div>
        </div>
    </div>

    <div id="deck" class="fixed bottom-10 flex gap-3 p-6 bg-slate-900/90 rounded-[2.5rem] border border-slate-800 backdrop-blur shadow-2xl overflow-x-auto max-w-[95vw]"></div>

    <script>
        const socket = io();
        let currentRoom = "", selectedEmoji = "🔥", emojiAttackCount = 0;
        const deckValues = [1, 2, 3, 5, 8, 13, 21, '?'];

        function joinRoom() {
            const user = document.getElementById('username').value;
            const room = document.getElementById('room').value || "general";
            if(!user) return;
            currentRoom = room;
            document.getElementById('login').style.display = 'none';
            document.getElementById('roomTitle').innerText = room;
            socket.emit('join_room', { roomId: room, username: user });
        }

        // Crear Deck
        deckValues.forEach(v => {
            const b = document.createElement('button');
            b.innerText = v;
            b.className = "w-14 h-20 bg-white text-slate-900 rounded-2xl font-black text-2xl hover:-translate-y-4 transition-all flex-shrink-0 shadow-lg border-b-4 border-slate-300";
            b.onclick = () => socket.emit('cast_vote', { roomId: currentRoom, value: v });
            document.getElementById('deck').appendChild(b);
        });

        socket.on('update_state', (state) => {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const players = Object.entries(state.votes);
            const total = players.length;
            let votesArr = [];

            players.forEach(([id, p], i) => {
                const angle = (i * (360 / total) - 90) * (Math.PI / 180);
                const radius = 240;
                const x = 250 + radius * Math.cos(angle);
                const y = 250 + radius * Math.sin(angle);

                const container = document.createElement('div');
                container.className = "player-spot flex flex-col items-center group";
                container.style.left = `${x}px`;
                container.style.top = `${y}px`;
                container.id = `player-${id}`;

                let content = state.visible ? (p.value ?? "-") : (p.value ? "✓" : "");
                let cardStyle = p.value ? (state.visible ? "bg-white text-blue-600 scale-110" : "bg-blue-600 text-white") : "bg-slate-800 border-2 border-dashed border-slate-700 text-transparent";
                if(state.visible && typeof p.value === 'number') votesArr.push(p.value);

                container.innerHTML = `
                    <div class="w-16 h-24 ${cardStyle} rounded-2xl flex items-center justify-center text-3xl font-black shadow-2xl transition-all duration-500 mb-2 cursor-crosshair relative" onclick="triggerEmoji('${id}', event)">
                        ${content}
                    </div>
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">${p.name}</span>
                `;
                grid.appendChild(container);
            });

            const avgDiv = document.getElementById('avg');
            if(state.visible && votesArr.length > 0) {
                avgDiv.innerText = (votesArr.reduce((a,b)=>a+b,0)/votesArr.length).toFixed(1);
            } else { avgDiv.innerText = ""; }
        });

        // LÓGICA DE EMOJIS (PROYECTIL)
        function triggerEmoji(toId, event) {
            const fromPos = { x: event.clientX, y: event.clientY };
            socket.emit('send_emoji', { roomId: currentRoom, toSocketId: toId, emoji: selectedEmoji, fromPos });
        }

        socket.on('animate_emoji', ({ toSocketId, fromPos, emoji }) => {
            const targetEl = document.getElementById(`player-${toSocketId}`);
            if(!targetEl) return;
            const targetPos = targetEl.getBoundingClientRect();

            const p = document.createElement('div');
            p.className = "projectile";
            p.innerText = emoji;
            p.style.left = fromPos.x + "px";
            p.style.top = fromPos.y + "px";
            document.body.appendChild(p);

            // Animación hacia la carta
            setTimeout(() => {
                p.style.left = (targetPos.left + 20) + "px";
                p.style.top = (targetPos.top + 20) + "px";
            }, 50);

            // Impacto
            setTimeout(() => {
                p.remove();
                // Si SOY YO el que recibe el emoji
                if(socket.id === toSocketId) {
                    emojiAttackCount++;
                    if(emojiAttackCount >= 8) {
                        document.body.classList.add('buzz-active');
                        setTimeout(() => { 
                            document.body.classList.remove('buzz-active');
                            emojiAttackCount = 0; 
                        }, 1000);
                    }
                }
            }, 650);
        });

        // Resto de utilidades
        function reveal() { socket.emit('reveal_votes', currentRoom); }
        function reset() { socket.emit('reset_game', currentRoom); }
        function updateTask() { socket.emit('update_task', { roomId: currentRoom, taskName: document.getElementById('taskInput').value }); }
        function copyLink() { navigator.clipboard.writeText(`${window.location.origin}/?room=${currentRoom}`); alert("Enlace copiado!"); }
        
        function exportCSV() {
            let csv = "Ronda,Tarea,Jugador,Voto\n";
            lastState.history?.forEach((r, i) => {
                Object.entries(r.results).forEach(([n, v]) => csv += `${i+1},${r.task},${n},${v}\n`);
            });
            const blob = new Blob([csv], {type:'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `sesion-${currentRoom}.csv`; a.click();
        }

        const u = new URLSearchParams(window.location.search).get('room');
        if(u) document.getElementById('room').value = u;
    </script>
</body>
</html>
