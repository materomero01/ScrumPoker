<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Plan Pro - Master</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
    <style>
        :root { --p-size: clamp(280px, 58vh, 500px); }
        body { 
            user-select: none; -webkit-user-select: none; 
            overflow: hidden; background-color: #020617; 
            height: 100vh; display: flex; flex-direction: column; font-family: ui-sans-serif, system-ui;
        }
        .table-center { 
            position: relative; width: var(--p-size); height: var(--p-size); 
            border-radius: 50%; background: radial-gradient(circle, #0f172a 0%, #020617 100%); 
            border: 6px solid #1e293b; display: flex; align-items: center; justify-content: center;
        }
        .player-spot { position: absolute; transform: translate(-50%, -50%); z-index: 50; }
        .playing-card {
            width: 3.5rem; height: 5rem; border-radius: 0.6rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 900;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { 
            background: #1e293b; border-left: 4px solid #3b82f6; color: white; padding: 12px 20px; 
            border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }

        .projectile { position: fixed; pointer-events: none; z-index: 1000; font-size: 2.2rem; transition: left 0.4s linear, top 0.4s cubic-bezier(0.1, 0.2, 0.3, 1); }
        .rebound { animation: fall-and-roll 0.8s ease-in forwards; }
        @keyframes fall-and-roll {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            30% { transform: translate(15px, -20px) rotate(45deg); opacity: 1; }
            100% { transform: translate(30px, 60px) rotate(180deg); opacity: 0; }
        }

        .buzz-active { animation: buzz 0.1s infinite; }
        @keyframes buzz { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(4px,4px); } 75% { transform: translate(-4px,-4px); } }
        #emoji-picker-container { display: none; position: absolute; top: 80px; right: 20px; z-index: 1000; border-radius: 1rem; overflow: hidden; }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="text-white p-4">

    <div id="toast-container"></div>

    <div id="login" class="fixed inset-0 bg-slate-950 z-[200] flex items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 w-full max-w-sm text-center shadow-2xl">
            <h1 class="text-3xl font-black mb-6 text-blue-500 italic uppercase">Poker Plan</h1>
            <input type="text" id="username" placeholder="Tu Nombre" class="w-full p-4 mb-6 bg-slate-800 rounded-2xl outline-none border border-slate-700 focus:border-blue-500 text-center">
            <button onclick="joinGame()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg hover:bg-blue-500 active:scale-95 transition-all shadow-lg shadow-blue-900/20">Entrar a la Sala</button>
        </div>
    </div>

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center z-50">
        <div class="flex flex-col">
            <h2 class="text-lg font-black text-blue-400 uppercase tracking-tighter">Sesión de Equipo</h2>
            <input type="text" id="taskInput" onchange="updateTask()" class="bg-transparent border-b border-slate-800 text-slate-500 outline-none w-48 focus:text-white transition-all py-1 text-sm" placeholder="Nombre de la tarea...">
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 gap-1 items-center shadow-inner">
                <button onclick="selectedEmoji='📄'" class="w-8 h-8 hover:bg-slate-800 rounded-lg transition-all">📄</button>
                <button onclick="selectedEmoji='✈️'" class="w-8 h-8 hover:bg-slate-800 rounded-lg transition-all">✈️</button>
                <button onclick="selectedEmoji='🔫'" class="w-8 h-8 hover:bg-slate-800 rounded-lg transition-all">🔫</button>
                <button onclick="selectedEmoji='🍅'" class="w-8 h-8 hover:bg-slate-800 rounded-lg transition-all">🍅</button>
                <button onclick="toggleEmojiPicker()" class="w-8 h-8 hover:bg-slate-800 rounded-lg transition-all text-blue-500 font-bold">+</button>
            </div>
            <button onclick="exportCSV()" class="bg-slate-900 border border-slate-800 hover:bg-slate-800 px-4 py-2.5 rounded-xl text-[10px] font-black text-slate-400 uppercase transition-all shadow-md active:scale-95">Exportar CSV</button>
        </div>
    </header>

    <div id="emoji-picker-container"><emoji-picker></emoji-picker></div>

    <div class="flex-grow flex items-center justify-center w-full relative min-h-0">
        <div class="table-center">
            <div id="grid" class="absolute inset-0 w-full h-full pointer-events-none"></div>
            <div class="z-[100] flex flex-col items-center text-center p-4">
                <button id="mainBtn" onclick="mainAction()" class="px-5 py-5 rounded-[2.2rem] font-black text-[10px] uppercase leading-tight transition-all shadow-2xl active:scale-90 border-2"></button>
                <div id="avg" class="mt-2 text-3xl font-black text-blue-400 italic"></div>
            </div>
        </div>
        
        <button onclick="copyLink()" class="absolute bottom-2 left-2 flex items-center gap-2 bg-blue-600 hover:bg-blue-500 px-4 py-3 rounded-2xl font-bold text-xs shadow-lg transition-all active:scale-95 group">
            <span class="text-base group-active:animate-ping">🔗</span>
            <span>COPIAR ENLACE</span>
        </button>
    </div>

    <div class="w-full flex justify-center pb-4">
        <div id="deck" class="flex gap-2 p-4 bg-slate-900/80 rounded-[2rem] border border-slate-800 backdrop-blur-md shadow-2xl overflow-x-auto max-w-[95vw]"></div>
    </div>

    <script>
        const socket = io();
        let selectedEmoji = "📄", attackHits = 0, isVisible = false, lastState = {};

        function showToast(msg, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast border-l-4 ${type === 'error' ? 'border-red-500' : 'border-blue-500'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        document.querySelector('emoji-picker').addEventListener('emoji-click', e => {
            selectedEmoji = e.detail.unicode;
            document.getElementById('emoji-picker-container').style.display = 'none';
        });

        function toggleEmojiPicker() {
            const c = document.getElementById('emoji-picker-container');
            c.style.display = c.style.display === 'block' ? 'none' : 'block';
        }

        // Ya no necesitamos roomId
        function joinGame() {
            const user = document.getElementById('username').value;
            if(!user) { showToast("Ingresa tu nombre", "error"); return; }
            document.getElementById('login').classList.add('hidden');
            socket.emit('join_game', { username: user });
            showToast(`Bienvenido, ${user}`);
        }

        // Deck de cartas
        [0, 1, 2, 3, 5, 8, 13, 21, '?', '☕'].forEach(v => {
            const b = document.createElement('button');
            b.innerText = v;
            b.className = "w-12 h-16 bg-white text-slate-950 rounded-xl font-black text-xl hover:-translate-y-2 transition-all flex-shrink-0 shadow-lg border-b-4 border-slate-300";
            b.onclick = () => socket.emit('cast_vote', { value: v });
            document.getElementById('deck').appendChild(b);
        });

        socket.on('update_state', (state) => {
            isVisible = state.visible;
            lastState = state;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const players = Object.entries(state.votes);
            const tableWidth = document.querySelector('.table-center').offsetWidth;
            const radius = (tableWidth / 2) - 5; 

            players.forEach(([id, p], i) => {
                const angle = (i * (360 / players.length) - 90) * (Math.PI / 180);
                const x = (tableWidth/2) + radius * Math.cos(angle);
                const y = (tableWidth/2) + radius * Math.sin(angle);
                const div = document.createElement('div');
                div.className = "player-spot flex flex-col items-center pointer-events-auto";
                div.style.left = `${x}px`; div.style.top = `${y}px`; div.id = `p-${id}`;

                let cardStyle = p.value !== null ? 
                    (state.visible ? "bg-white text-blue-600 border-blue-400 scale-105" : "bg-blue-600 text-white shadow-blue-500/50") : 
                    "bg-slate-900/50 border-dashed border-2 border-slate-800 text-transparent shadow-none";
                
                div.innerHTML = `
                    <div class="playing-card ${cardStyle}" onclick="sendEmoji('${id}', event)">
                        ${state.visible ? (p.value ?? "-") : (p.value !== null ? "✓" : "")}
                    </div>
                    <span class="text-[8px] font-black text-slate-500 uppercase tracking-widest mt-2 truncate max-w-[60px]">${p.name}</span>
                `;
                grid.appendChild(div);
            });

            const btn = document.getElementById('mainBtn');
            const allVoted = Object.values(state.votes).every(p => p.value !== null);

            if(state.visible) {
                btn.innerHTML = "SIGUIENTE<br>TAREA";
                btn.className = "px-5 py-5 rounded-[2.2rem] font-black text-[10px] bg-slate-900 text-white border-slate-800 active:scale-90 transition-all cursor-pointer";
            } else {
                btn.innerHTML = "REVELAR<br>CARTAS";
                btn.className = `px-5 py-5 rounded-[2.2rem] font-black text-[10px] ${allVoted ? 'bg-blue-600 hover:bg-blue-500 border-blue-500' : 'bg-slate-800 text-slate-500 border-slate-700 cursor-not-allowed'} transition-all active:scale-90`;
            }

            const vArr = Object.values(state.votes).filter(p => typeof p.value === 'number').map(p => p.value);
            document.getElementById('avg').innerText = (state.visible && vArr.length) ? (vArr.reduce((a,b)=>a+b,0)/vArr.length).toFixed(1) : "";
            document.getElementById('taskInput').value = state.taskName;
        });

        function mainAction() {
            const allVoted = Object.values(lastState.votes).every(p => p.value !== null);
            
            if(!isVisible) {
                if(!allVoted) {
                    const btn = document.getElementById('mainBtn');
                    btn.classList.add('shake', 'bg-red-900/50', 'text-red-200');
                    setTimeout(() => btn.classList.remove('shake', 'bg-red-900/50', 'text-red-200'), 400);
                    showToast("Faltan compañeros por votar", "error");
                    return;
                }
                socket.emit('reveal_votes');
            } else {
                let t = document.getElementById('taskInput').value;
                let next = t.replace(/\d+$/, (n) => parseInt(n) + 1);
                if(next === t) next += " 2";
                socket.emit('update_task', { taskName: next });
                socket.emit('reset_game');
                showToast("Nueva ronda iniciada");
            }
        }

        function sendEmoji(toId, e) {
            if(toId === socket.id) return;
            socket.emit('send_emoji', { toSocketId: toId, emoji: selectedEmoji, fromPos: {x: e.clientX, y: e.clientY} });
        }

        socket.on('animate_emoji', ({ toSocketId, fromPos, emoji }) => {
            const target = document.getElementById(`p-${toSocketId}`);
            if(!target) return;
            const rect = target.getBoundingClientRect();
            const p = document.createElement('div');
            p.className = "projectile"; p.innerText = emoji;
            p.style.left = fromPos.x + "px"; p.style.top = fromPos.y + "px";
            document.body.appendChild(p);
            setTimeout(() => { p.style.left = (rect.left + 15) + "px"; p.style.top = (rect.top + 15) + "px"; }, 20);
            setTimeout(() => {
                p.classList.add('rebound');
                if(socket.id === toSocketId) {
                    attackHits++;
                    if(attackHits > 7) {
                        document.body.classList.add('buzz-active');
                        setTimeout(() => { document.body.classList.remove('buzz-active'); attackHits = 0; }, 1000);
                    }
                }
            }, 420);
            setTimeout(() => { p.remove(); }, 1200);
        });

        function copyLink() {
            navigator.clipboard.writeText(window.location.origin);
            showToast("Enlace de acceso copiado");
        }

        function updateTask() { 
            socket.emit('update_task', { taskName: document.getElementById('taskInput').value }); 
            showToast("Tarea actualizada");
        }
        
        function exportCSV() {
            if(!lastState.history?.length) { showToast("No hay historial", "error"); return; }
            let csv = "Ronda,Tarea,Jugador,Voto\n";
            lastState.history.forEach((r, i) => {
                Object.entries(r.results).forEach(([n, v]) => csv += `${i+1},${r.task},${n},${v}\n`);
            });
            const b = new Blob([csv], {type: 'text/csv'});
            const u = URL.createObjectURL(b);
            const a = document.createElement('a');
            a.href = u; a.download = `poker-equipo.csv`; a.click();
            showToast("Historial descargado");
        }
    </script>
</body>
</html>
